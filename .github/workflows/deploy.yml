name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたら自動起動

env:
  PROJECT_ID: 'あなたのGCPプロジェクトID'
  REGION: 'asia-northeast1' # 東京リージョン（無料枠対象）
  SERVICE_NAME: 'fastapi-embedding-api'
  REPOSITORY_NAME: 'my-artifacts' # Artifact Registryのレポジトリ名

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Actionsの無料枠（月2,000分）を無駄に消費しないよう、10分でタイムアウトさせる
    timeout-minutes: 10

    # Workload Identity連携に必要な権限設定
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Google Cloud 認証（Workload Identity）
    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/【プロジェクト番号】/locations/global/workloadIdentityPools/【プール名】/providers/【プロバイダー名】'
        service_account: '【サービスアカウントのメールアドレス】'

    # 2. DockerをArtifact Registryにプッシュするための認証設定
    - name: Docker Auth
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 3. Dockerイメージのビルドとプッシュ
    - name: Build and Push Container
      run: |
        TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        docker build -t $TAG .
        docker push $TAG
        echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

    # 4. Cloud Run へのデプロイ（★ここで無料枠を死守する設定を入れます）
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloud-run@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.IMAGE_TAG }}
        flags: |
          --allow-unauthenticated
          --min-instances=0
          --max-instances=1
          --memory=2Gi
          --cpu=1
